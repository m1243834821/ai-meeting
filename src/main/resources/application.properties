### web
server.port=8091
server.servlet.context-path=/htsc-meeting-ai-service
spring.profiles.active=dev

### mybatis
mybatis.mapper-locations=classpath:/mapper/*Mapper.xml

htsc.dubbo.application.name=htsc-meeting-ai-service

htsc.octopus.sysno=000283@htsc-meeting-ai-service
htsc.octopus.persist=true

logging.config=classpath:conf/logback-spring.xml

spring.dubbo.registry.timeout=60000

### kafka consumer 公共参数
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.max.poll.records=5
spring.kafka.consumer.max.poll.interval.ms=600000
spring.kafka.consumer.session.timeout.ms=30000
spring.kafka.consumer.heartbeat.interval.ms=10000
spring.kafka.consumer.auto.startup.enable=true
spring.kafka.security.protocol=SASL_PLAINTEXT
spring.kafka.sasl.mechanism=SCRAM-SHA-512
